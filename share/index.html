<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>Text Share</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --border: #2d2d4e;
      --text: #e8e8f0;
      --muted: #6b6b8d;
      --accent: #6c63ff;
      --accent-hover: #7c74ff;
      --danger: #ff6b6b;
      --radius: 12px;
    }

    html {
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    body {
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      gap: 12px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .count {
      margin-left: auto;
      font-size: 0.75rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    #textbox {
      flex: 1;
      width: 100%;
      min-height: 200px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 14px 16px;
      resize: none;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    #textbox:focus {
      border-color: var(--accent);
    }

    #textbox::placeholder {
      color: var(--muted);
    }

    #textbox.flash {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    button {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
      font-family: inherit;
      letter-spacing: -0.01em;
    }

    button:active { transform: scale(0.97); }

    #copyBtn {
      background: var(--accent);
      color: #fff;
    }

    #copyBtn:hover { background: var(--accent-hover); }
    #copyBtn:disabled { opacity: 0.4; cursor: default; }

    #copyBtn.success {
      background: #22c55e;
    }

    .toast {
      position: fixed;
      bottom: calc(80px + env(safe-area-inset-bottom, 0));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #22c55e;
      color: #fff;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      max-width: calc(100% - 32px);
      text-align: center;
      line-height: 1.4;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Informational variant, e.g. "duplicate skipped" */
    .toast.info { background: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="dot"></div>
    <h1>Text Share</h1>
    <span class="count" id="charCount">0 chars</span>
  </header>

  <div class="actions">
    <button id="copyBtn" disabled>Copy &amp; Clear</button>
  </div>

  <textarea id="textbox" placeholder="Shared URLs appear here. You can also type freely.&#10;&#10;Paste rich text (e.g. from Google Docs) to extract just the links it contains, one per line.&#10;&#10;Use 'Copy &amp; Clear' to copy everything and wipe the pad."></textarea>

  <div class="toast" id="toast">Copied!</div>

  <script>
    // Two shares of the same page can differ only by share-tracking params
    // (YouTube's ?si=, utm_*), so ignore those when comparing links. Meaningful
    // params like ?v=, ?list= and ?t= are kept, so different timestamps of the
    // same video still count as different links.
    // Declared up here: the incoming-share handler below runs immediately.
    const TRACKING = /^(si|feature|utm_[a-z_]+)$/i;

    // Hosts where the query string is part of the address rather than tracking
    // noise: youtube.com/watch?v=…, /playlist?list=…, youtu.be short links
    // carrying ?t=. Everywhere else ?args are dropped. Add a host here if
    // stripping ?args breaks its links.
    const KEEP_QUERY_HOSTS = ['youtube.com', 'youtu.be', 'youtube-nocookie.com'];

    // Elements that start a new line when pasted rich text is flattened.
    const BLOCK_TAGS = 'p, div, li, tr, td, th, h1, h2, h3, h4, h5, h6, ' +
      'blockquote, pre, section, article, header, footer, figcaption, dt, dd';

    const textarea = document.getElementById('textbox');
    const copyBtn = document.getElementById('copyBtn');
    const charCount = document.getElementById('charCount');
    const toast = document.getElementById('toast');
    const KEY = 'textshare-v1';

    // Restore saved content
    textarea.value = localStorage.getItem(KEY) || '';
    updateUI();

    // Handle incoming share (GET params) — extract URLs only, discard plain text/title
    const params = new URLSearchParams(location.search);
    const incoming = extractUrls(
      [params.get('url'), params.get('text'), params.get('title')].filter(Boolean).join(' ')
    );

    function extractUrls(str) {
      const matches = str.match(/https?:\/\/[^\s<>"{}|\\^`[\]]+/g) || [];
      return [...new Set(matches.map(trimTrailing).map(stripArgs))];
    }

    // URLs written inline in prose usually end up with the sentence's
    // punctuation glued on: "see https://example.com/page." or "(https://x.y)".
    function trimTrailing(u) {
      u = u.replace(/[.,;:!?'"]+$/, '');
      while (u.endsWith(')') && (u.match(/\(/g) || []).length < (u.match(/\)/g) || []).length) {
        u = u.slice(0, -1);
      }
      return u;
    }

    function keepsQuery(u) {
      try {
        const host = new URL(u).hostname.toLowerCase();
        return KEEP_QUERY_HOSTS.some(d => host === d || host.endsWith('.' + d));
      } catch {
        return false;
      }
    }

    function stripArgs(u) {
      return keepsQuery(u) ? u : u.split('?')[0];
    }

    if (location.search) history.replaceState(null, '', location.pathname);

    if (incoming.length) {
      const fresh = pickNew(incoming);
      const skipped = incoming.length - fresh.length;
      if (fresh.length) {
        const current = textarea.value.trimEnd();
        const added = fresh.join('\n');
        textarea.value = current ? current + '\n' + added : added;
        save();
        updateUI();
        // Scroll to bottom so the new line is visible
        textarea.scrollTop = textarea.scrollHeight;
        // Flash to signal new content arrived
        textarea.classList.add('flash');
        setTimeout(() => textarea.classList.remove('flash'), 600);
      }
      notifySkipped(fresh.length, skipped);
    }

    // Duplicate handling — a link already in the pad is never added twice,
    // and the snackbar explains what was skipped.
    function currentLinks() {
      return textarea.value.split('\n').map(l => l.trim()).filter(Boolean);
    }

    function linkKey(u) {
      try {
        const url = new URL(u);
        for (const k of [...url.searchParams.keys()]) {
          if (TRACKING.test(k)) url.searchParams.delete(k);
        }
        if (url.pathname.length > 1 && url.pathname.endsWith('/')) {
          url.pathname = url.pathname.slice(0, -1);
        }
        return url.protocol + '//' + url.hostname.toLowerCase() +
               url.pathname + url.search + url.hash;
      } catch {
        return u.trim();
      }
    }

    // Drops links already in the pad, and repeats within `links` itself.
    function pickNew(links) {
      const seen = new Set(currentLinks().map(linkKey));
      const fresh = [];
      for (const u of links) {
        const k = linkKey(u);
        if (seen.has(k)) continue;
        seen.add(k);
        fresh.push(u);
      }
      return fresh;
    }

    function notifySkipped(added, skipped) {
      if (!skipped) return;
      const dupes = skipped === 1 ? 'duplicate' : 'duplicates';
      showToast(
        added ? `Added ${added} · skipped ${skipped} ${dupes}`
          : skipped === 1 ? 'Already in the list — not added'
          : `All ${skipped} links were already in the list`,
        'info'
      );
    }

    textarea.addEventListener('input', () => {
      save();
      updateUI();
    });

    // Pasting rich text (e.g. copied from Google Docs) inserts only the
    // hyperlinks it contains, one per line. Plain-text pastes are untouched.
    textarea.addEventListener('paste', e => {
      const html = e.clipboardData?.getData('text/html');
      if (!html) return;
      const links = extractLinksFromHtml(html);
      if (!links.length) return;
      e.preventDefault();
      const fresh = pickNew(links);
      if (fresh.length) {
        insertAtCursor(fresh.join('\n'));
        save();
        updateUI();
      }
      notifySkipped(fresh.length, links.length - fresh.length);
    });

    // Picks up both real hyperlinks and URLs written out as plain text.
    // Swapping each anchor for its target turns the whole thing into one text
    // blob, so extractUrls() finds both kinds in document order and applies
    // the same ?args stripping the share path uses.
    function extractLinksFromHtml(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      if (!doc.body) return [];
      doc.querySelectorAll('a[href]').forEach(a => {
        a.replaceWith(' ' + unwrapGoogleRedirect(a.getAttribute('href')) + ' ');
      });
      // textContent runs adjacent blocks together with no separator, so a
      // bullet list of bare URLs would come out as one glued-up string. Break
      // the block boundaries first — but only those: a URL split across
      // several inline <span>s must still join back up.
      doc.querySelectorAll('br, hr').forEach(el => el.replaceWith('\n'));
      doc.querySelectorAll(BLOCK_TAGS).forEach(el => el.append('\n'));
      return extractUrls(doc.body.textContent);
    }

    // Google sometimes wraps copied links as google.com/url?q=<real-url>
    function unwrapGoogleRedirect(href) {
      try {
        const url = new URL(href);
        if (url.hostname.endsWith('google.com') && url.pathname === '/url') {
          const target = url.searchParams.get('q') || url.searchParams.get('url');
          if (target && /^https?:\/\//i.test(target)) return target;
        }
      } catch {}
      return href;
    }

    function insertAtCursor(text) {
      const before = textarea.value.slice(0, textarea.selectionStart);
      const after = textarea.value.slice(textarea.selectionEnd);
      const prefix = before && !before.endsWith('\n') ? '\n' : '';
      const suffix = after && !after.startsWith('\n') ? '\n' : '';
      textarea.value = before + prefix + text + suffix + after;
      const pos = (before + prefix + text).length;
      textarea.setSelectionRange(pos, pos);
      textarea.scrollTop = textarea.scrollHeight;
    }

    copyBtn.addEventListener('click', async () => {
      if (!textarea.value) return;
      try {
        await navigator.clipboard.writeText(textarea.value);
      } catch {
        // Fallback for older browsers
        textarea.select();
        document.execCommand('copy');
        window.getSelection()?.removeAllRanges();
      }
      textarea.value = '';
      save();
      updateUI();
      showToast();
    });

    function save() {
      localStorage.setItem(KEY, textarea.value);
    }

    function updateUI() {
      const len = textarea.value.length;
      copyBtn.disabled = len === 0;
      charCount.textContent = len === 0 ? '0 chars'
        : len === 1 ? '1 char'
        : `${len.toLocaleString()} chars`;
    }

    function showToast(msg = 'Copied!', variant = 'success') {
      toast.textContent = msg;
      toast.classList.toggle('info', variant === 'info');
      toast.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.classList.remove('show'), variant === 'info' ? 2800 : 1800);
    }

    /* A cache-version bump alone never refreshes a page already on screen, so
       reload once a new worker takes over. The update is applied immediately when
       the page has just loaded or is hidden, and otherwise deferred until the page
       is next hidden -- so a reload can never interrupt work in progress. */
    if ('serviceWorker' in navigator) {
      addEventListener('load', async () => {
        const t0 = Date.now();
        const hadController = !!navigator.serviceWorker.controller;
        let applied = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!hadController || applied) return;   // first install: nothing stale to replace
          applied = true;
          if (Date.now() - t0 < 10000 || document.visibilityState === 'hidden') location.reload();
          else document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') location.reload();
          }, { once: true });
        });
        try {
          const reg = await navigator.serviceWorker.register('./sw.js');
          reg.update().catch(() => {});
          // Resuming a backgrounded PWA is not a navigation, so check on focus too.
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update().catch(() => {});
          });
        } catch {}
      });
    }
  </script>
</body>
</html>
