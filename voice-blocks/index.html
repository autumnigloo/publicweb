<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Voice Blocks</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* Height of the area actually visible above the on-screen keyboard, and how
   far down the page that area starts. Both are kept in sync with
   visualViewport by JS; the dvh fallback covers browsers without it. */
:root { --app-h: 100dvh; --app-top: 0px; }

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0f0f13;
  color: #e0e0e0;
  height: var(--app-h);
  overflow: hidden;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 0.35rem;
  transform: translateY(var(--app-top));
}

.card {
  background: #1a1a24;
  border: 1px solid #2a2a3a;
  border-radius: 14px;
  padding: 0.55rem;
  width: 100%;
  max-width: 640px;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}


#clear-btn {
  background: #1c1c26;
  border: 1px solid #2a2a3a;
  border-radius: 10px;
  color: #666;
  font-size: 0.85rem;
  padding: 0.6rem 1rem;
  cursor: pointer;
  width: 100%;
  flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
#clear-btn:hover { background: #252530; border-color: #444; color: #bbb; }
#clear-btn .tally {
  color: #4a4a5a;
  margin-left: 0.45rem;
  font-variant-numeric: tabular-nums;
}
#clear-btn:disabled { opacity: 0.35; cursor: default; }
#clear-btn.del { background: #1a0f0f; border-color: #4a1f1f; color: #b05050; }
#clear-btn.del:hover { background: #241515; border-color: #c0392b; color: #e06060; }

#editor {
  flex: 1;
  background: #0f0f13;
  border: 1px solid #2a2a3a;
  border-radius: 10px;
  color: #e0e0e0;
  font-size: 1rem;
  line-height: 1.65;
  padding: 0.55rem 0.65rem;
  resize: none;
  outline: none;
  font-family: inherit;
  flex-basis: 0;
  min-height: 140px;
}
#editor:focus { border-color: #4a60c8; }
#editor::placeholder { color: #3a3a4a; }

#record-btn {
  background: #4f6ef7;
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 0.8rem;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  flex-shrink: 0;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}
#record-btn:hover { background: #5f7ef8; }
#record-btn:disabled { background: #2a2a3a; color: #666; cursor: default; }
#record-btn.recording { background: #c0392b; }
#record-btn.recording:hover { background: #e74c3c; }

/* While the on-screen keyboard is open, sacrifice the record button (and its
   status line) so the textarea + nav bar stay fully visible in the shrunken
   viewport. The textarea gives up its comfortable minimum too, so a short
   landscape viewport still fits the nav bar instead of pushing it off. */
body.kb-open .rec-row { display: none; }
body.kb-open #status { display: none; }
body.kb-open #editor { min-height: 3.5rem; }

#status {
  font-size: 0.78rem; color: #666;
  text-align: center; min-height: 1rem; flex-shrink: 0;
  border-radius: 8px; padding: 0.1rem 0;
  transition: background 0.15s, padding 0.15s;
}
#status.err  { color: #eb5757; }
#status.cmd  {
  color: #a0a0c8; background: #1e1e2e;
  border: 1px solid #2a2a42;
  padding: 0.45rem 0.8rem;
  cursor: pointer;
  font-size: 0.82rem;
}

.bottom-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.3rem;
  flex-shrink: 0;
}
.bar-spacer { flex: 1; }

.rec-row {
  display: flex;
  align-items: stretch;
  gap: 0.5rem;
  flex-shrink: 0;
}
.rec-row #record-btn { flex: 1; }
.rec-row #settings-btn { width: 3.4rem; height: auto; }

button.icon {
  background: #252530;
  border: 1px solid #353545;
  border-radius: 8px;
  color: #c0c0d8;
  font-size: 1.35rem;
  width: 3.1rem;
  height: 3.1rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.15s;
  padding: 0;
}
button.icon:hover { background: #30304a; border-color: #4f6ef7; }
button.icon:disabled { color: #3a3a4a; background: #1e1e28; border-color: #252530; cursor: default; }

.block-num {
  font-size: 0.78rem;
  color: #666;
  min-width: 2.8rem;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

/* Settings modal */
#modal {
  display: none;
  position: fixed; inset: 0;
  background: #000c; z-index: 99;
  align-items: flex-start; justify-content: center;
  padding: 1.5rem 0.75rem;
}
#modal:not([hidden]) { display: flex; }

.mbox {
  background: #1a1a24;
  border: 1px solid #2a2a3a;
  border-radius: 14px;
  padding: 1.1rem;
  width: 100%; max-width: 480px;
  display: flex; flex-direction: column; gap: 0.85rem;
  margin-top: 1rem;
  height: calc(var(--app-h) - 3rem);
}

.mhead {
  display: flex; align-items: center; justify-content: space-between;
}
.mhead span { font-size: 0.92rem; font-weight: 500; color: #ddd; }

.mclose {
  background: none; border: none; color: #555; font-size: 0.82rem;
  cursor: pointer; padding: 0.2rem 0.5rem; border-radius: 6px;
}
.mclose:hover { color: #ccc; background: #252530; }

.field { display: flex; flex-direction: column; gap: 0.3rem; }
.field.grow { flex: 1; }
label { font-size: 0.75rem; color: #777; }

#config-box {
  background: #0f0f13;
  border: 1px solid #2a2a3a;
  border-radius: 8px;
  color: #e0e0e0;
  font-size: 0.82rem;
  padding: 0.52rem 0.75rem;
  outline: none;
  font-family: 'Courier New', monospace;
  resize: none;
  line-height: 1.8;
  width: 100%;
  height: 6.6rem;
}
#config-box:focus { border-color: #4a60c8; }
#mic-select {
  background: #0f0f13;
  border: 1px solid #2a2a3a;
  border-radius: 8px;
  color: #e0e0e0;
  font-size: 0.82rem;
  padding: 0.52rem 0.75rem;
  width: 100%;
  outline: none;
  font-family: inherit;
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
}
#mic-select:focus { border-color: #4a60c8; }

/* Cut history */
.hist-head { display: flex; align-items: center; justify-content: space-between; }
#hist-clear {
  background: none; border: none; color: #555; font-size: 0.72rem;
  cursor: pointer; padding: 0.1rem 0.4rem; border-radius: 6px;
}
#hist-clear:hover { color: #c66; }
#hist-list {
  flex: 1; min-height: 0; overflow-y: auto;
  display: flex; flex-direction: column; gap: 0.5rem;
  -webkit-overflow-scrolling: touch;
}
.hist-empty { font-size: 0.8rem; color: #555; padding: 0.4rem 0; }
.hist-item {
  background: #0f0f13; border: 1px solid #2a2a3a; border-radius: 8px;
  padding: 0.5rem 0.65rem; display: flex; flex-direction: column; gap: 0.35rem;
}
.hist-meta { display: flex; align-items: center; gap: 0.5rem; font-size: 0.7rem; color: #777; }
.hist-kind { color: #8a9ae8; }
.hist-kind.all { color: #d9a45a; }
.hist-copy {
  margin-left: auto; background: #252538; border: 1px solid #34344a; color: #ddd;
  font-size: 0.75rem; padding: 0.3rem 0.8rem; border-radius: 6px; cursor: pointer;
}
.hist-copy.done { background: #24402c; border-color: #3a6b48; color: #bfe6c8; }
.hist-text {
  font-size: 0.82rem; color: #ccc; line-height: 1.45; white-space: pre-wrap; word-break: break-word;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  cursor: pointer; user-select: text;
}
.hist-item.open .hist-text { display: block; }
</style>
</head>
<body>
<div class="card">
  <button id="clear-btn" disabled>Cut</button>

  <textarea id="editor" placeholder="Press Record to begin…" spellcheck="false"></textarea>

  <div class="bottom-controls">
    <button class="icon" id="prev-btn" title="Previous block">←</button>
    <button class="icon" id="next-btn" title="Next block">→</button>
    <span class="block-num" id="block-num">1 / 1</span>
    <button class="icon" id="undo-btn" title="Undo">↩</button>
    <button class="icon" id="redo-btn" title="Redo">↪</button>
    <button class="icon" id="add-btn" title="Add block after current">+</button>
  </div>

  <div id="status"></div>
  <div class="rec-row">
    <button id="record-btn">Record</button>
    <button class="icon" id="settings-btn" title="Settings">⚙</button>
  </div>
</div>

<!-- Settings modal -->
<div id="modal" hidden>
  <div class="mbox">
    <div class="mhead">
      <span>Settings</span>
      <button class="mclose" id="mclose">✕ Close</button>
    </div>
    <div class="field">
      <label for="config-box">Config — one value per line: Groq key · OpenRouter key · model</label>
      <textarea id="config-box" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
        placeholder="gsk_…&#10;sk-or-…&#10;google/gemini-3.1-flash-lite"></textarea>
    </div>
    <div class="field">
      <label for="mic-select">Microphone</label>
      <select id="mic-select"><option value="">Default (system)</option></select>
    </div>
    <div class="field grow" style="min-height:0">
      <div class="hist-head">
        <label>Cut history — last 7 days · tap text to expand</label>
        <button id="hist-clear">Clear</button>
      </div>
      <div id="hist-list"></div>
    </div>
  </div>
</div>

<script>
// ── constants ─────────────────────────────────────────────────────────────────
const SK = { groq: 'vb-groq', or: 'vb-or', orm: 'vb-orm', data: 'vb-data', cur: 'vb-cur', mic: 'vb-mic', cuts: 'vb-cuts' };
const DEF_MODEL = 'google/gemini-3.1-flash-lite';
const g = id => document.getElementById(id);

// ── settings modal ────────────────────────────────────────────────────────────
const modal    = g('modal');
const configEl = g('config-box');

function loadS() {
  const groq  = localStorage.getItem(SK.groq) || '';
  const or    = localStorage.getItem(SK.or)   || '';
  const model = localStorage.getItem(SK.orm)  || DEF_MODEL;
  configEl.value = [groq, or, model].join('\n');
}
function saveS() {
  const [groq = '', or = '', model = ''] = configEl.value.split('\n').map(s => s.trim().replace(/\r/g, ''));
  localStorage.setItem(SK.groq, groq);
  localStorage.setItem(SK.or,   or);
  localStorage.setItem(SK.orm,  model || DEF_MODEL);
}
function closeModal() { saveS(); modal.setAttribute('hidden', ''); }

const micSelect = g('mic-select');
async function populateMicSelect() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const mics = devices.filter(d => d.kind === 'audioinput');
    const stored = localStorage.getItem(SK.mic) || '';
    micSelect.innerHTML = '<option value="">Default (system)</option>';
    for (const d of mics) {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label || ('Microphone ' + micSelect.options.length);
      if (d.deviceId === stored) opt.selected = true;
      micSelect.appendChild(opt);
    }
  } catch (_) {}
}
micSelect.addEventListener('change', () => localStorage.setItem(SK.mic, micSelect.value));

// ── cut history ───────────────────────────────────────────────────────────────
// Every Cut (one block) and long-press cut-all (all blocks joined) is kept for a
// week, so text survives even if the clipboard is overwritten before pasting.
const HIST_DAYS = 7, HIST_MAX = 300;
function loadCuts() {
  try {
    const cutoff = Date.now() - HIST_DAYS * 864e5;
    return (JSON.parse(localStorage.getItem(SK.cuts) || '[]') || []).filter(c => c && c.t >= cutoff && c.text);
  } catch { return []; }
}
function logCut(text, kind) {
  if (!text || !text.trim()) return;
  const cuts = loadCuts();
  cuts.unshift({ t: Date.now(), kind, text });
  try { localStorage.setItem(SK.cuts, JSON.stringify(cuts.slice(0, HIST_MAX))); } catch {}
}
function fmtWhen(t) {
  const d = new Date(t), now = new Date();
  const hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === now.toDateString()) return 'Today ' + hm;
  if (d.toDateString() === new Date(now - 864e5).toDateString()) return 'Yesterday ' + hm;
  return d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' }) + ' ' + hm;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  // fallback for when the async clipboard API is refused
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch {}
  ta.remove();
  return ok;
}
const histList = g('hist-list');
function renderHistory() {
  const cuts = loadCuts();
  try { localStorage.setItem(SK.cuts, JSON.stringify(cuts)); } catch {}   // drop expired entries
  histList.replaceChildren();
  if (!cuts.length) {
    const e = document.createElement('div');
    e.className = 'hist-empty'; e.textContent = 'Nothing cut in the last 7 days.';
    histList.append(e); return;
  }
  for (const c of cuts) {
    const item = document.createElement('div'); item.className = 'hist-item';
    const meta = document.createElement('div'); meta.className = 'hist-meta';
    const kind = document.createElement('span');
    kind.className = 'hist-kind' + (c.kind === 'all' ? ' all' : '');
    kind.textContent = c.kind === 'all' ? 'All blocks' : 'Block';
    const when = document.createElement('span'); when.textContent = fmtWhen(c.t);
    const len = document.createElement('span'); len.textContent = c.text.length + ' chars';
    const btn = document.createElement('button'); btn.className = 'hist-copy'; btn.textContent = 'Copy';
    btn.onclick = async () => {
      const ok = await copyText(c.text);
      btn.textContent = ok ? 'Copied' : 'Failed'; btn.classList.toggle('done', ok);
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1500);
    };
    meta.append(kind, when, len, btn);
    const txt = document.createElement('div'); txt.className = 'hist-text'; txt.textContent = c.text;
    txt.onclick = () => item.classList.toggle('open');
    item.append(meta, txt);
    histList.append(item);
  }
}
g('hist-clear').onclick = () => {
  if (!confirm('Clear the cut history?')) return;
  localStorage.removeItem(SK.cuts); renderHistory();
};

g('settings-btn').onclick = () => { loadS(); populateMicSelect(); renderHistory(); histList.scrollTop = 0; modal.removeAttribute('hidden'); };
g('mclose').onclick = closeModal;
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

// ── state ─────────────────────────────────────────────────────────────────────
// us/rs are undo/redo stacks of { t, sel }: the text and the [start, end]
// selection it had, or sel null when there was no meaningful cursor.
function mkBlock(text = '') { return { text, us: [], rs: [] }; }

let blocks = [mkBlock()], ci = 0;
const cb = () => blocks[ci];

function persist() {
  localStorage.setItem(SK.data, JSON.stringify(blocks.map(b => b.text)));
  localStorage.setItem(SK.cur, String(ci));
}

function loadData() {
  try {
    const raw = localStorage.getItem(SK.data);
    if (!raw) return;
    const texts = JSON.parse(raw);
    const cur   = parseInt(localStorage.getItem(SK.cur) || '0', 10) || 0;
    if (Array.isArray(texts) && texts.length) {
      blocks = texts.map(t => mkBlock(typeof t === 'string' ? t : ''));
      ci = Math.min(Math.max(cur, 0), blocks.length - 1);
    }
  } catch {}
}

// ── ui refs ───────────────────────────────────────────────────────────────────
const editor   = g('editor'),   blockNum = g('block-num');
const prevBtn  = g('prev-btn'), nextBtn  = g('next-btn');
const undoBtn  = g('undo-btn'), redoBtn  = g('redo-btn');
const addBtn   = g('add-btn'),  recBtn   = g('record-btn');
const clearBtn = g('clear-btn'), statusEl = g('status');

// Words are whitespace-separated runs; characters are Unicode code points, so
// astral chars (emoji, CJK extensions) count once rather than as two UTF-16
// units. Whitespace and newlines each count as one character.
function countText(text) {
  return {
    w: (text.match(/\S+/g) || []).length,
    c: [...text].length,
  };
}

function render() {
  const b = cb(), empty = !b.text.trim();
  editor.value = b.text;
  blockNum.textContent = `${ci + 1} / ${blocks.length}`;
  recBtn.textContent = empty ? 'Record' : 'Edit';
  undoBtn.disabled = !b.us.length;
  redoBtn.disabled = !b.rs.length;
  prevBtn.disabled = ci === 0;
  nextBtn.disabled = ci === blocks.length - 1;
  const canDel = empty && blocks.length > 1;
  clearBtn.replaceChildren(canDel ? 'Delete Block' : 'Cut');
  if (!canDel) {
    const n = countText(b.text);
    const tally = document.createElement('span');
    tally.className = 'tally';
    tally.textContent = `(${n.w}w, ${n.c}c)`;
    clearBtn.appendChild(tally);
  }
  clearBtn.className   = canDel ? 'del' : '';
  clearBtn.disabled    = empty && blocks.length === 1;
}

let cmdTimer = null;

function setStatus(msg, err = false) {
  clearTimeout(cmdTimer); cmdTimer = null;
  statusEl.textContent = msg;
  statusEl.className = err ? 'err' : '';
}

function showCmd(cmd) {
  clearTimeout(cmdTimer);
  statusEl.textContent = cmd;
  statusEl.className = 'cmd';
  cmdTimer = setTimeout(() => setStatus(''), 5000);
}

statusEl.addEventListener('click', () => { if (statusEl.className === 'cmd') setStatus(''); });

// ── manual edits & undo ───────────────────────────────────────────────────────
// Paste, drop and keyboard-menu cut are single undo steps of their own, as is
// any one change of 20+ characters (Gboard's clipboard chip, select-all and
// type). Ordinary typing and backspacing are grouped: a run of them becomes
// one undo step once there have been 5 s without input, or as soon as anything
// else (undo, a button, a recording) touches the block.
const TYPE_IDLE = 5000, BIG_EDIT = 20;
const DISCRETE = /^(insertFromPaste|insertFromPasteAsQuotation|insertFromDrop|insertFromYank|deleteByCut|deleteByDrag)$/;
let typing = null;                       // { b, before, sel, timer } for the open run
let preSel = null;                       // selection just before the current edit

const curSel = () => [editor.selectionStart, editor.selectionEnd];

function commitTyping() {
  if (!typing) return;
  const { b, before, sel } = typing;
  clearTimeout(typing.timer);
  typing = null;
  if (b.text !== before) b.us.push({ t: before, sel });
  undoBtn.disabled = !cb().us.length;
}

editor.addEventListener('beforeinput', () => { preSel = curSel(); });

editor.addEventListener('input', e => {
  const b = cb(), before = b.text, after = editor.value;
  if (before === after) return;
  const discrete = DISCRETE.test(e.inputType || '') || Math.abs(after.length - before.length) >= BIG_EDIT;
  if (discrete) {
    commitTyping();
    b.us.push({ t: before, sel: preSel });
  } else {
    if (typing && typing.b !== b) commitTyping();
    if (!typing) typing = { b, before, sel: preSel };
    clearTimeout(typing.timer);
    typing.timer = setTimeout(commitTyping, TYPE_IDLE);
  }
  preSel = null;
  b.rs = [];
  b.text = after;
  persist();
  render();
  if (typing) undoBtn.disabled = false;   // the open run can already be undone
});

// ── caret restore ─────────────────────────────────────────────────────────────
// Undo/redo put the cursor back where it was in the restored state (or, when
// that is unknown, at the end of the changed region) and then scroll only as
// far as needed to bring it on screen, smoothly. Setting the value and the
// selection would otherwise jump the textarea to the end / to the caret.
function changeEnd(from, to) {
  let p = 0;
  const max = Math.min(from.length, to.length);
  while (p < max && from[p] === to[p]) p++;
  let q = 0;
  while (q < max - p && from[from.length - 1 - q] === to[to.length - 1 - q]) q++;
  return to.length - q;
}

function caretTop(pos) {
  const cs = getComputedStyle(editor), m = document.createElement('div');
  for (const k of ['fontFamily', 'fontSize', 'fontWeight', 'fontStyle', 'letterSpacing',
                   'lineHeight', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft',
                   'tabSize', 'textTransform', 'wordSpacing']) m.style[k] = cs[k];
  Object.assign(m.style, {
    position: 'absolute', visibility: 'hidden', top: '0', left: '-9999px',
    boxSizing: 'border-box', border: '0', width: editor.clientWidth + 'px',
    whiteSpace: 'pre-wrap', overflowWrap: 'break-word',
  });
  m.textContent = editor.value.slice(0, pos);
  const mark = document.createElement('span');
  mark.textContent = '\u200b';
  m.appendChild(mark);
  document.body.appendChild(m);
  const top = mark.offsetTop;
  m.remove();
  return top;
}

function showRestored(entry, prevText) {
  const top = editor.scrollTop;
  render();
  const len = editor.value.length;
  let [s, e] = entry.sel || [];
  if (s == null || s > len || e > len) s = e = changeEnd(prevText, entry.t);
  editor.setSelectionRange(s, e);
  editor.scrollTop = top;

  const cs = getComputedStyle(editor);
  const lineH = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.65;
  const padT = parseFloat(cs.paddingTop) || 0, padB = parseFloat(cs.paddingBottom) || 0;
  const y = caretTop(e), view = editor.clientHeight;
  let target = null;
  if (y - padT < top) target = y - padT;
  else if (y + lineH + padB > top + view) target = y + lineH + padB - view;
  if (target === null) return;
  const smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  editor.scrollTo({ top: target, behavior: smooth ? 'smooth' : 'auto' });
}

// ── navigation & block ops ────────────────────────────────────────────────────
// Preserve the keyboard state across nav taps. Only when the keyboard is
// actually open (kb-open, from the visualViewport listener) do we prevent
// mousedown's default so the textarea keeps focus and the keyboard stays up.
// When it is closed, the default blur is allowed — otherwise the still-
// focused textarea would pop the keyboard back open on Android.
document.querySelector('.bottom-controls').addEventListener('mousedown', e => {
  if (document.body.classList.contains('kb-open')) e.preventDefault();
});

prevBtn.onclick = () => { commitTyping(); if (ci > 0) { ci--; persist(); render(); } };
nextBtn.onclick = () => { commitTyping(); if (ci < blocks.length - 1) { ci++; persist(); render(); } };

addBtn.onclick = () => {
  commitTyping();
  blocks.splice(ci + 1, 0, mkBlock());
  ci++;
  persist();
  render();
};

undoBtn.onclick = () => {
  commitTyping();
  const b = cb();
  if (!b.us.length) return;
  const prev = b.text, entry = b.us.pop();
  b.rs.push({ t: prev, sel: curSel() });
  b.text = entry.t;
  persist();
  showRestored(entry, prev);
  setStatus('');
};

redoBtn.onclick = () => {
  commitTyping();
  const b = cb();
  if (!b.rs.length) return;
  const prev = b.text, entry = b.rs.pop();
  b.us.push({ t: prev, sel: curSel() });
  b.text = entry.t;
  persist();
  showRestored(entry, prev);
  setStatus('');
};

clearBtn.onclick = async () => {
  commitTyping();
  const b = cb(), empty = !b.text.trim();
  if (empty && blocks.length > 1) {
    blocks.splice(ci, 1);
    if (ci >= blocks.length) ci = blocks.length - 1;
  } else if (!empty) {
    logCut(b.text, 'block');
    try { await navigator.clipboard.writeText(b.text); } catch {}
    b.us.push({ t: b.text, sel: curSel() }); b.rs = [];
    b.text = '';
  }
  persist();
  render();
};

// ── context builder ───────────────────────────────────────────────────────────
function buildContext(idx) {
  const prev = blocks.slice(0, idx).map(b => b.text).filter(t => t.trim());
  const next = blocks.slice(idx + 1).map(b => b.text).filter(t => t.trim());
  if (!prev.length && !next.length) return '';
  const parts = [];
  if (prev.length) parts.push('Earlier blocks:\n' + prev.join('\n\n'));
  if (next.length) parts.push('Later blocks:\n'   + next.join('\n\n'));
  return parts.join('\n\n') + '\n\n';
}

// ── api ───────────────────────────────────────────────────────────────────────
async function transcribe(blob) {
  const key = localStorage.getItem(SK.groq);
  if (!key) throw new Error('No Groq API key — open Settings.');
  const fd = new FormData();
  fd.append('file', blob, 'audio.webm');
  fd.append('model', 'whisper-large-v3-turbo');
  const r = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
    method: 'POST', headers: { Authorization: `Bearer ${key}` }, body: fd,
  });
  if (!r.ok) throw new Error(`Whisper ${r.status}`);
  return (await r.json()).text?.trim() || '';
}

const SYS_CLEAN = `You are a dictation post-processor for a single-speaker voice recording. Clean up the raw Whisper transcript: fix transcription errors, normalize punctuation, and apply spoken editing commands such as "scratch that" or "replace X with Y". Use the surrounding blocks as reference for correct spelling of names and terms. Do NOT answer questions or add content. Return only the cleaned text.`;

const SYS_EDIT = `You are a voice-driven text editor. Apply the user's spoken edit command to the current block. Use the surrounding blocks as context for correct spelling, names, and continuity. Return ONLY the modified block text with no commentary, prefix, or explanation.`;

async function llm(sys, user) {
  const key = localStorage.getItem(SK.or);
  if (!key) throw new Error('No OpenRouter key — open Settings.');
  const model = localStorage.getItem(SK.orm) || DEF_MODEL;
  const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: { Authorization: `Bearer ${key}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ model, messages: [
      { role: 'system', content: sys },
      { role: 'user',   content: user },
    ]}),
  });
  if (!r.ok) throw new Error(`LLM ${r.status}`);
  return (await r.json()).choices[0].message.content.trim();
}

// ── recording + long-press cut-all ────────────────────────────────────────────
let mr = null, chunks = [], recording = false;
let lpTimer = null, lpFired = false;

async function cutAll() {
  commitTyping();
  const all = blocks.map(b => b.text.trim()).filter(Boolean).join('\n\n');
  if (all) { logCut(all, 'all'); try { await navigator.clipboard.writeText(all); } catch {} }
  blocks = [mkBlock()]; ci = 0;
  persist(); render();
  setStatus(all ? 'All blocks copied and cleared.' : 'Cleared.');
}

recBtn.addEventListener('contextmenu', e => e.preventDefault());

recBtn.addEventListener('pointerdown', () => {
  if (recording) return;
  lpFired = false;
  lpTimer = setTimeout(() => { lpFired = true; lpTimer = null; cutAll(); }, 700);
});
recBtn.addEventListener('pointerup',     () => { clearTimeout(lpTimer); lpTimer = null; });
recBtn.addEventListener('pointercancel', () => { clearTimeout(lpTimer); lpTimer = null; });

recBtn.addEventListener('click', async () => {
  if (lpFired) { lpFired = false; return; }
  commitTyping();

  if (recording) { mr.stop(); return; }
  if (!localStorage.getItem(SK.groq)) {
    setStatus('No Groq API key — open Settings.', true); return;
  }

  let stream;
  const micId = localStorage.getItem(SK.mic);
  const audioConstraint = micId ? { deviceId: { exact: micId } } : true;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraint }); }
  catch { setStatus('Microphone access denied.', true); return; }

  chunks = [];
  mr = new MediaRecorder(stream);
  mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };

  mr.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    recording = false;
    recBtn.classList.remove('recording');
    recBtn.disabled = true;
    setStatus('Transcribing…');

    try {
      const blob    = new Blob(chunks, { type: 'audio/webm' });
      const whisper = await transcribe(blob);
      if (!whisper) { setStatus('No speech detected.'); return; }

      commitTyping();                 // typing during transcription stays undoable
      const b     = cb();
      const empty = !b.text.trim();
      const ctx   = buildContext(ci);
      const orKey = localStorage.getItem(SK.or);

      if (empty) {
        if (orKey) {
          setStatus('Processing…');
          const userMsg   = ctx ? `${ctx}---\nTranscription to clean up:\n${whisper}` : whisper;
          const processed = await llm(SYS_CLEAN, userMsg);
          b.us = [{ t: whisper, sel: null }]; b.rs = [];
          b.text = processed;
          persist();
        } else {
          b.us = []; b.rs = [];
          b.text = whisper;
          persist();
        }
      } else {
        if (!orKey) {
          setStatus('No OpenRouter key for editing — open Settings.', true); return;
        }
        setStatus('Applying edit…');
        const userMsg = `${ctx}---\nCurrent block:\n${b.text}\n\n---\nEdit command: ${whisper}`;
        const edited  = await llm(SYS_EDIT, userMsg);
        b.us.push({ t: b.text, sel: curSel() }); b.rs = [];
        b.text = edited;
        persist();
      }
      empty ? setStatus('') : showCmd(whisper);
    } catch (e) {
      setStatus(e.message, true);
    } finally {
      recBtn.disabled = false;
      render();
    }
  };

  mr.start();
  recording = true;
  recBtn.textContent = 'Stop';
  recBtn.classList.add('recording');
  setStatus('Recording…');
});

// ── on-screen keyboard: keep the shell inside the visible viewport ───────────
// Don't trust 100dvh to shrink. Phone Chrome resizes the layout viewport when
// the keyboard opens (so dvh shrinks), but large-screen Android often leaves
// the layout viewport alone and only shrinks/pans the visual viewport — there
// dvh stays at full screen height and the nav bar ends up behind the keyboard.
// Driving --app-h/--app-top off visualViewport works in both modes, and the
// record row is dropped once the keyboard eats a real chunk of the screen.
if (window.visualViewport) {
  const vv   = window.visualViewport;
  const root = document.documentElement;
  let baseW = vv.width, baseH = vv.height;

  const syncViewport = () => {
    if (vv.scale > 1.01) return;               // pinch-zoomed: leave layout alone
    // Width only changes on rotation / window resize, never on the keyboard —
    // so use it to re-baseline instead of letting baseH ratchet up forever.
    if (Math.abs(vv.width - baseW) > 1) { baseW = vv.width; baseH = vv.height; }
    baseH = Math.max(baseH, vv.height);

    root.style.setProperty('--app-h', vv.height + 'px');
    root.style.setProperty('--app-top', vv.offsetTop + 'px');
    document.body.classList.toggle('kb-open', baseH - vv.height > 120);
  };

  vv.addEventListener('resize', syncViewport);
  vv.addEventListener('scroll', syncViewport);
  syncViewport();
}

// ── PWA ───────────────────────────────────────────────────────────────────────
/* A cache-version bump alone never refreshes a page already on screen, so
   reload once a new worker takes over. The update is applied immediately when
   the page has just loaded or is hidden, and otherwise deferred until the page
   is next hidden -- so a reload can never interrupt work in progress. */
if ('serviceWorker' in navigator) {
  addEventListener('load', async () => {
    const t0 = Date.now();
    const hadController = !!navigator.serviceWorker.controller;
    let applied = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || applied) return;   // first install: nothing stale to replace
      applied = true;
      if (Date.now() - t0 < 10000 || document.visibilityState === 'hidden') location.reload();
      else document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') location.reload();
      }, { once: true });
    });
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      reg.update().catch(() => {});
      // Resuming a backgrounded PWA is not a navigation, so check on focus too.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update().catch(() => {});
      });
    } catch {}
  });
}

// ── init ──────────────────────────────────────────────────────────────────────
loadData();

// Handle incoming Web Share Target (Android "Share with")
const _sp = new URLSearchParams(location.search);
const _shared = (_sp.get('text') || _sp.get('url') || '').trim();
if (_shared) {
  const paras = _shared.split(/\n{2,}/).map(p => p.trim()).filter(Boolean);
  blocks = (paras.length ? paras : [_shared]).map(p => mkBlock(p));
  ci = 0;
  persist();
  history.replaceState(null, '', location.pathname);
}

render();
</script>
