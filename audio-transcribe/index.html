<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Transcribe</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f0f13">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Transcribe">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f13;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 0.5rem;
    }

    .card {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 14px;
      padding: 0.9rem;
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      align-self: flex-start;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #fff;
    }

    .picker {
      border: 2px dashed #2a2a3a;
      border-radius: 10px;
      padding: 1rem 0.8rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      color: #888;
      font-size: 0.9rem;
    }
    .picker:hover, .picker.drag { border-color: #4f6ef7; background: #4f6ef710; color: #c8c8e0; }
    .picker input { display: none; }
    .picker .filename { color: #c8c8e0; font-family: monospace; font-size: 0.85rem; word-break: break-all; }
    .picker .meta { font-size: 0.75rem; color: #666; margin-top: 0.3rem; }

    button {
      background: #4f6ef7;
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: 0.7rem 1rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
      letter-spacing: 0.02em;
      width: 100%;
    }
    button:hover { background: #5f7ef8; }
    button:active { transform: scale(0.97); background: #3a5ae0; }
    button:disabled { background: #2a2a3a; color: #666; cursor: default; transform: none; }

    button.secondary {
      background: transparent;
      border: 1px solid #4f6ef7;
      color: #4f6ef7;
    }
    button.secondary:hover { background: #4f6ef720; }
    button.secondary:disabled { border-color: #2a2a3a; color: #444; background: transparent; }

    button.danger {
      background: transparent;
      border: 1px solid #eb5757;
      color: #eb5757;
    }
    button.danger:hover { background: #eb575720; }
    button.danger:disabled { border-color: #2a2a3a; color: #444; background: transparent; }

    .rec-row { display: flex; gap: 0.5rem; }
    .rec-row > button { width: auto; }
    .rec-row > #record-btn { flex: 1; }
    .rec-row > #delete-btn { flex: 0 0 auto; padding-left: 1.1rem; padding-right: 1.1rem; }

    #record-btn.recording { background: #eb5757; }
    #record-btn.recording:hover  { background: #f06e6e; }
    #record-btn.recording:active { background: #d44a4a; }
    #record-btn.recording::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      margin-right: 0.5rem;
      vertical-align: middle;
      animation: rec-pulse 1.2s infinite ease-in-out;
    }
    @keyframes rec-pulse {
      0%, 100% { opacity: 1;   transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.85); }
    }

    .diff-row {
      display: flex;
    }
    #diff-btn {
      flex: 1;
    }
    button.toggled {
      background: #4f6ef7;
      color: #fff;
      border-color: #4f6ef7;
    }

    .progress {
      display: none;
      height: 3px;
      background: #2a2a3a;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }
    .progress.busy { display: block; }
    .progress::after {
      content: '';
      position: absolute;
      top: 0;
      left: -40%;
      width: 40%;
      height: 100%;
      background: #4f6ef7;
      animation: slide 1.2s infinite ease-in-out;
    }
    @keyframes slide { to { left: 100%; } }

    /* Wrapper keeps a constant size; textarea and diff-view both fill it. */
    .text-wrap {
      position: relative;
      height: clamp(14rem, 50vh, 36rem);
      min-height: 10rem;
      overflow: auto;
      resize: vertical;
      border-radius: 10px;
    }
    .text-wrap > textarea, .text-wrap > .diff-view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
    }

    textarea#transcript {
      background: #0f0f13;
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      color: #e0e0e0;
      padding: 0.8rem 0.9rem;
      font-size: 0.95rem;
      line-height: 1.55;
      font-family: 'Segoe UI', system-ui, sans-serif;
      resize: none;
      outline: none;
    }
    textarea#transcript:focus { border-color: #4f6ef7; }

    .diff-view {
      overflow: auto;
      background: #0f0f13;
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      color: #c8c8d8;
      padding: 0.8rem 0.9rem;
      font-size: 0.95rem;
      line-height: 1.6;
      font-family: 'Segoe UI', system-ui, sans-serif;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .diff-view ins {
      background: #1f4d2e;
      color: #c4ecd1;
      text-decoration: none;
      border-radius: 3px;
      padding: 0 2px;
    }
    .diff-view del {
      background: #4d1f24;
      color: #ecc4ca;
      text-decoration: line-through;
      text-decoration-color: #ecc4ca80;
      border-radius: 3px;
      padding: 0 2px;
    }
    .diff-empty {
      color: #666;
      font-style: italic;
      font-size: 0.85rem;
    }

    details {
      border-top: 1px solid #2a2a3a;
      padding-top: 0.7rem;
    }
    summary {
      cursor: pointer;
      font-size: 0.78rem;
      color: #888;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      user-select: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: '▸'; transition: transform 0.2s; }
    details[open] summary::after { transform: rotate(90deg); }

    .settings-body {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      margin-top: 0.7rem;
    }
    label {
      font-size: 0.78rem;
      color: #888;
      display: block;
      margin-bottom: 0.25rem;
    }
    input[type="text"], #keys-input {
      background: #0f0f13;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 0.9rem;
      padding: 0.55rem 0.75rem;
      width: 100%;
      outline: none;
      font-family: monospace;
    }
    input:focus, #keys-input:focus { border-color: #4f6ef7; }
    #keys-input { resize: vertical; min-height: 3.6rem; line-height: 1.4; }

    .snackbar {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%) translateY(160%);
      background: #2a2a38;
      color: #fff;
      padding: 0.7rem 1.1rem;
      border-radius: 9px;
      font-size: 0.88rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      transition: transform 0.25s ease, opacity 0.25s ease;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      max-width: calc(100vw - 1.5rem);
      text-align: center;
      border-left: 3px solid #4f6ef7;
    }
    .snackbar.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .snackbar.ok   { border-left-color: #6fcf97; }
    .snackbar.err  { border-left-color: #eb5757; }
    .snackbar.busy { border-left-color: #f2c94c; }
  </style>
</head>
<body>

<div class="card">
  <h1>Audio Transcribe</h1>

  <label class="picker" id="picker">
    <input type="file" id="file-input" accept="audio/*,.m4a,.mp3,.wav,.ogg,.webm,.aac,.flac,.mp4">
    <div id="picker-text">Tap to choose an audio file<br><span class="meta">or share from the Recorder app</span></div>
  </label>

  <div class="rec-row">
    <button id="record-btn">Record</button>
    <button id="delete-btn" class="danger" hidden>Delete</button>
  </div>

  <div class="progress" id="progress"></div>

  <div class="diff-row" id="diff-row" hidden>
    <button id="diff-btn" class="secondary">Diff</button>
  </div>

  <div class="text-wrap">
    <textarea id="transcript" placeholder="Transcript will appear here…" spellcheck="false"></textarea>
    <div id="diff-view" class="diff-view" hidden></div>
  </div>

  <button id="cut-btn" class="secondary" disabled>Cut</button>

  <details id="settings">
    <summary>Settings</summary>
    <div class="settings-body">
      <div>
        <label for="keys-input">API keys — line 1: OpenRouter, line 2: Groq</label>
        <textarea id="keys-input" rows="2" spellcheck="false" autocomplete="off"
          placeholder="sk-or-…&#10;gsk_…"></textarea>
      </div>
      <div>
        <label for="model-input">Whisper model</label>
        <input type="text" id="model-input" placeholder="whisper-large-v3-turbo" spellcheck="false" autocomplete="off">
      </div>
      <div>
        <label for="lang-input">Language code (optional, e.g. en)</label>
        <input type="text" id="lang-input" placeholder="auto" spellcheck="false" autocomplete="off">
      </div>
      <div>
        <label for="or-model-input">OpenRouter model</label>
        <input type="text" id="or-model-input" placeholder="deepseek/deepseek-v4-flash" spellcheck="false" autocomplete="off">
      </div>
      <button class="secondary" id="save-settings">Save</button>
    </div>
  </details>
</div>

<div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>

<script>
  const KEY_KEYS         = 'audio-transcribe-keys';
  const KEY_MODEL        = 'audio-transcribe-model';
  const KEY_LANG         = 'audio-transcribe-lang';
  const KEY_OR_MODEL     = 'audio-transcribe-or-model';
  const KEY_TRANSCRIPT   = 'audio-transcribe-transcript';
  const KEY_DIFF_BEFORE  = 'audio-transcribe-diff-before';
  const KEY_DIFF_AFTER   = 'audio-transcribe-diff-after';
  const KEY_DIFF_ON      = 'audio-transcribe-diff-on';
  const LEGACY_KEY_GROQ  = 'audio-transcribe-groq-key';
  const LEGACY_KEY_OR    = 'audio-transcribe-or-key';
  const DEFAULT_MODEL    = 'whisper-large-v3-turbo';
  const DEFAULT_OR_MODEL = 'deepseek/deepseek-v4-flash';

  const fileInput    = document.getElementById('file-input');
  const picker       = document.getElementById('picker');
  const pickerText   = document.getElementById('picker-text');
  const recordBtn    = document.getElementById('record-btn');
  const deleteBtn    = document.getElementById('delete-btn');
  const cutBtn       = document.getElementById('cut-btn');
  const diffBtn      = document.getElementById('diff-btn');
  const diffRow      = document.getElementById('diff-row');
  const transcript   = document.getElementById('transcript');
  const diffView     = document.getElementById('diff-view');
  const progressEl   = document.getElementById('progress');
  const keysInput    = document.getElementById('keys-input');
  const modelInput   = document.getElementById('model-input');
  const langInput    = document.getElementById('lang-input');
  const orModelInput = document.getElementById('or-model-input');
  const saveBtn      = document.getElementById('save-settings');
  const settings     = document.getElementById('settings');
  const snackbar     = document.getElementById('snackbar');

  /* -------- Snackbar -------- */
  let snackbarTimer = null;
  function notify(msg, type = '') {
    if (!msg) {
      snackbar.classList.remove('show');
      return;
    }
    snackbar.textContent = msg;
    snackbar.className = 'snackbar show ' + type;
    clearTimeout(snackbarTimer);
    if (type !== 'busy') {
      const ms = type === 'err' ? 5000 : 2500;
      snackbarTimer = setTimeout(() => snackbar.classList.remove('show'), ms);
    }
  }

  /* -------- Settings keys -------- */
  function parseKeys(text) {
    const lines = (text || '').split(/\r?\n/).map(s => s.trim());
    return { openrouter: lines[0] || '', groq: lines[1] || '' };
  }
  function getKeys() {
    return parseKeys(localStorage.getItem(KEY_KEYS) || '');
  }

  /* -------- Busy / output state -------- */
  let isBusy = false;
  function setBusy(busy) {
    isBusy = busy;
    progressEl.classList.toggle('busy', busy);
    recordBtn.disabled = busy;
    deleteBtn.disabled = busy || recState === 'idle';
    updatePickerLock();
  }

  function updatePickerLock() {
    const locked = isBusy || recState !== 'idle';
    fileInput.disabled = locked;
    picker.style.pointerEvents = locked ? 'none' : '';
    picker.style.opacity = locked ? '0.5' : '';
  }

  function updateOutputButtons() {
    cutBtn.disabled = transcript.value.length === 0;
    const has = hasSnapshot();
    diffRow.hidden = !has;
    diffBtn.disabled = !has;
  }

  /* -------- Diff snapshot storage -------- */
  function hasSnapshot() {
    return localStorage.getItem(KEY_DIFF_BEFORE) !== null
        && localStorage.getItem(KEY_DIFF_AFTER)  !== null;
  }
  function saveSnapshot(before, after) {
    localStorage.setItem(KEY_DIFF_BEFORE, before);
    localStorage.setItem(KEY_DIFF_AFTER,  after);
  }
  function clearSnapshot() {
    localStorage.removeItem(KEY_DIFF_BEFORE);
    localStorage.removeItem(KEY_DIFF_AFTER);
    if (diffMode !== 0) setDiffMode(0);
  }

  // diffMode: 0 = processed/edit, 1 = original transcription, 2 = diff
  let diffMode = 0;

  function renderRawTranscription() {
    const before = localStorage.getItem(KEY_DIFF_BEFORE) || '';
    if (!before) {
      diffView.innerHTML = '<div class="diff-empty">No original transcription snapshot.</div>';
      return;
    }
    diffView.textContent = before;
  }

  // Button label tells you what the next click will show.
  const DIFF_MODE_NEXT_LABELS = ['Original', 'Diff', 'Processed'];

  function setDiffMode(mode) {
    if (!hasSnapshot()) mode = 0;
    diffMode = mode;
    const showOverlay = mode !== 0;
    transcript.hidden = showOverlay;
    diffView.hidden   = !showOverlay;
    diffBtn.classList.toggle('toggled', showOverlay);
    diffBtn.textContent = DIFF_MODE_NEXT_LABELS[mode];
    localStorage.setItem(KEY_DIFF_ON, String(mode));
    if (mode === 1) renderRawTranscription();
    if (mode === 2) renderSnapshotDiff();
  }

  function renderSnapshotDiff() {
    const before = localStorage.getItem(KEY_DIFF_BEFORE) || '';
    const after  = localStorage.getItem(KEY_DIFF_AFTER)  || '';
    diffView.innerHTML = '';
    if (!before && !after) {
      const p = document.createElement('div');
      p.className = 'diff-empty';
      p.textContent = 'No cleanup snapshot yet.';
      diffView.appendChild(p);
      return;
    }
    const ops = buildDiff(before, after);
    for (const [kind, text] of ops) {
      if (kind === '=') {
        diffView.appendChild(document.createTextNode(text));
      } else {
        const el = document.createElement(kind === '+' ? 'ins' : 'del');
        el.textContent = text;
        diffView.appendChild(el);
      }
    }
  }

  /* -------- Word/punctuation-level diff --------
     Tokenize into separate runs of: word chars, whitespace, punctuation.
     This way "hello" → "hello," only marks "," as inserted, leaving the
     unchanged word alone. */
  const TOKEN_RE = /[\p{L}\p{N}_'’]+|\s+|[^\s\p{L}\p{N}_'’]+/gu;
  function tokenize(s) {
    return s.match(TOKEN_RE) || [];
  }

  function pushOp(ops, kind, text) {
    const last = ops[ops.length - 1];
    if (last && last[0] === kind) last[1] += text;
    else ops.push([kind, text]);
  }

  function diffTokens(A, B) {
    const n = A.length, m = B.length;
    const W = m + 1;
    const dp = new Int32Array((n + 1) * W);
    for (let i = n - 1; i >= 0; i--) {
      const rowI  = i * W;
      const rowI1 = (i + 1) * W;
      for (let j = m - 1; j >= 0; j--) {
        if (A[i] === B[j]) dp[rowI + j] = dp[rowI1 + j + 1] + 1;
        else dp[rowI + j] = Math.max(dp[rowI1 + j], dp[rowI + j + 1]);
      }
    }
    const ops = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (A[i] === B[j]) { pushOp(ops, '=', A[i]); i++; j++; }
      else if (dp[(i + 1) * W + j] >= dp[i * W + j + 1]) { pushOp(ops, '-', A[i]); i++; }
      else { pushOp(ops, '+', B[j]); j++; }
    }
    while (i < n) pushOp(ops, '-', A[i++]);
    while (j < m) pushOp(ops, '+', B[j++]);
    return ops;
  }

  function buildDiff(before, after) {
    const A = tokenize(before);
    const B = tokenize(after);
    const MAX = 4_000_000;
    if ((A.length + 1) * (B.length + 1) > MAX) {
      return diffTokens(before.split(/(\n+)/), after.split(/(\n+)/));
    }
    return diffTokens(A, B);
  }

  /* -------- Picker -------- */
  function formatBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  function setFilePreview(file) {
    if (!file) {
      pickerText.innerHTML = 'Tap to choose an audio file<br><span class="meta">or share from the Recorder app</span>';
      return;
    }
    pickerText.innerHTML =
      '<div class="filename">' + (file.name || 'shared-audio') + '</div>' +
      '<div class="meta">' + formatBytes(file.size) + (file.type ? ' · ' + file.type : '') + '</div>';
  }

  async function handleFile(file) {
    if (!file) return;
    setFilePreview(file);
    await runTranscribeAndCleanup(file);
  }

  fileInput.addEventListener('change', () => {
    const f = fileInput.files && fileInput.files[0];
    if (f) handleFile(f);
  });

  ['dragover', 'dragenter'].forEach(ev =>
    picker.addEventListener(ev, e => { e.preventDefault(); picker.classList.add('drag'); })
  );
  ['dragleave', 'drop'].forEach(ev =>
    picker.addEventListener(ev, e => { e.preventDefault(); picker.classList.remove('drag'); })
  );
  picker.addEventListener('drop', e => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });

  /* -------- In-app recording --------
     States: 'idle' → 'recording' → 'stopped' → (transcribe) → 'idle' */
  let recState = 'idle';
  let mediaRecorder = null;
  let recStream = null;
  let recChunks = [];
  let recBlob = null;
  let recMime = '';
  let recStartedAt = 0;
  let recTickTimer = null;

  function pickRecMime() {
    const candidates = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/mp4;codecs=mp4a.40.2',
      'audio/mp4',
      'audio/aac',
      'audio/ogg;codecs=opus',
      'audio/ogg'
    ];
    if (typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported) return '';
    for (const m of candidates) {
      if (MediaRecorder.isTypeSupported(m)) return m;
    }
    return '';
  }

  function extForMime(mime) {
    if (!mime) return 'webm';
    if (mime.includes('webm')) return 'webm';
    if (mime.includes('mp4'))  return 'm4a';
    if (mime.includes('aac'))  return 'm4a';
    if (mime.includes('ogg'))  return 'ogg';
    if (mime.includes('wav'))  return 'wav';
    return 'webm';
  }

  function setRecState(state) {
    recState = state;
    recordBtn.classList.toggle('recording', state === 'recording');
    if (state === 'idle') {
      recordBtn.textContent = 'Record';
      recordBtn.disabled = false;
      deleteBtn.hidden = true;
      deleteBtn.disabled = true;
    } else if (state === 'recording') {
      recordBtn.textContent = 'Stop';
      recordBtn.disabled = false;
      deleteBtn.hidden = false;
      deleteBtn.disabled = false;
    } else if (state === 'stopped') {
      recordBtn.textContent = 'Transcribe';
      recordBtn.disabled = false;
      deleteBtn.hidden = false;
      deleteBtn.disabled = false;
    }
    updatePickerLock();
  }

  function tickRecLabel() {
    if (recState !== 'recording') return;
    const secs = Math.floor((performance.now() - recStartedAt) / 1000);
    const mm = Math.floor(secs / 60);
    const ss = String(secs % 60).padStart(2, '0');
    recordBtn.textContent = `Stop · ${mm}:${ss}`;
  }

  function releaseStream() {
    if (recStream) {
      try { recStream.getTracks().forEach(t => t.stop()); } catch {}
      recStream = null;
    }
  }

  async function startRecording() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      notify('Microphone not available in this browser.', 'err');
      return;
    }
    try {
      recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      notify('Microphone permission denied.', 'err');
      return;
    }
    recMime = pickRecMime();
    try {
      mediaRecorder = recMime
        ? new MediaRecorder(recStream, { mimeType: recMime })
        : new MediaRecorder(recStream);
    } catch (err) {
      notify('Recording unsupported: ' + err.message, 'err');
      releaseStream();
      return;
    }

    recChunks = [];
    recBlob = null;
    mediaRecorder.ondataavailable = e => {
      if (e.data && e.data.size > 0) recChunks.push(e.data);
    };
    mediaRecorder.onstop = () => {
      const mime = mediaRecorder.mimeType || recMime || 'audio/webm';
      recBlob = recChunks.length ? new Blob(recChunks, { type: mime }) : null;
      releaseStream();
      if (recBlob) {
        setRecState('stopped');
        recordBtn.textContent = `Transcribe · ${formatBytes(recBlob.size)}`;
        notify('Recorded ' + formatBytes(recBlob.size) + ' — tap Transcribe.', 'ok');
      } else {
        setRecState('idle');
      }
    };

    mediaRecorder.start();
    recStartedAt = performance.now();
    setRecState('recording');
    tickRecLabel();
    clearInterval(recTickTimer);
    recTickTimer = setInterval(tickRecLabel, 500);
    notify('Recording…', 'busy');
  }

  function stopRecording() {
    clearInterval(recTickTimer);
    recTickTimer = null;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      try { mediaRecorder.stop(); } catch {}
    } else {
      releaseStream();
      setRecState('idle');
    }
  }

  function deleteRecording() {
    clearInterval(recTickTimer);
    recTickTimer = null;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.ondataavailable = null;
      mediaRecorder.onstop = null;
      try { mediaRecorder.stop(); } catch {}
    }
    releaseStream();
    mediaRecorder = null;
    recChunks = [];
    recBlob = null;
    setRecState('idle');
    notify('Recording deleted.', 'ok');
  }

  async function transcribeRecording() {
    if (!recBlob) { setRecState('idle'); return; }
    const ext = extForMime(recBlob.type);
    const file = new File([recBlob], `recording.${ext}`, { type: recBlob.type || 'audio/webm' });
    setFilePreview(file);
    // Pre-clear local rec state; setBusy will lock UI during the request.
    mediaRecorder = null;
    recChunks = [];
    recBlob = null;
    try {
      await runTranscribeAndCleanup(file);
    } finally {
      setRecState('idle');
    }
  }

  recordBtn.addEventListener('click', () => {
    if (recState === 'idle')      startRecording();
    else if (recState === 'recording') stopRecording();
    else if (recState === 'stopped')   transcribeRecording();
  });

  deleteBtn.addEventListener('click', deleteRecording);

  /* -------- Pipeline: transcribe → cleanup (when OR key set) -------- */
  async function runTranscribeAndCleanup(file) {
    const text = await transcribe(file);
    if (text && getKeys().openrouter) {
      await cleanupTranscript();
    }
  }

  async function transcribe(file) {
    const { groq: apiKey } = getKeys();
    if (!apiKey) {
      notify('Set your Groq API key in Settings (line 2).', 'err');
      settings.open = true;
      keysInput.focus();
      return null;
    }
    const model = (localStorage.getItem(KEY_MODEL) || '').trim() || DEFAULT_MODEL;
    const lang  = (localStorage.getItem(KEY_LANG)  || '').trim();

    setBusy(true);
    notify('Transcribing… (' + formatBytes(file.size) + ')', 'busy');

    const fd = new FormData();
    const sendName = file.name && /\.[a-z0-9]+$/i.test(file.name) ? file.name : 'recording.m4a';
    fd.append('file', file, sendName);
    fd.append('model', model);
    fd.append('response_format', 'json');
    if (lang) fd.append('language', lang);

    try {
      const t0 = performance.now();
      const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + apiKey },
        body: fd,
      });
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(res.status + ': ' + errText.slice(0, 300));
      }
      const data = await res.json();
      const text = (data.text || '').trim();
      const sep = transcript.value.trim() ? '\n\n' : '';
      transcript.value = transcript.value + sep + text;
      persistTranscript();
      updateOutputButtons();
      const secs = ((performance.now() - t0) / 1000).toFixed(1);
      notify('Transcribed in ' + secs + 's.', 'ok');
      return text;
    } catch (err) {
      console.error(err);
      notify('Error: ' + err.message, 'err');
      return null;
    } finally {
      setBusy(false);
    }
  }

  async function cleanupTranscript({ rangeStart } = {}) {
    const { openrouter: orKey } = getKeys();
    if (!orKey) {
      notify('Set your OpenRouter API key in Settings (line 1).', 'err');
      settings.open = true;
      keysInput.focus();
      return;
    }
    const orModel = (localStorage.getItem(KEY_OR_MODEL) || '').trim() || DEFAULT_OR_MODEL;

    const cleanWhole = (typeof rangeStart !== 'number');
    const target = cleanWhole ? transcript.value : transcript.value.slice(rangeStart).trim();
    if (!target.trim()) return;

    setBusy(true);
    notify('Cleaning up with ' + orModel + '…', 'busy');

    const beforeSnapshot = transcript.value;

    const system = [
      'You are a dictation post-processor for a single-speaker recording.',
      'Treat the input as raw speech that the speaker is *building up over time*, and produce the speaker’s intended FINAL text.',
      '',
      'Apply two kinds of edits:',
      '',
      '1. Cleanup (always):',
      '   - fix punctuation, capitalization, and obvious word-recognition errors',
      '   - remove filler words (um, uh, like, you know) and stutters',
      '   - remove false starts and self-corrections, keeping only the corrected version',
      '   - add paragraph breaks where appropriate',
      '',
      '2. Execute meta-commands the speaker addresses to you. The speaker may issue editing instructions mid-stream — those instructions must be APPLIED to the surrounding content and then REMOVED from the output. Examples:',
      '   - "Actually, his name was Ben." → update every reference to that same person earlier in the text to "Ben", then drop the instruction.',
      '   - "Ignore the previous section." / "Scratch that last paragraph." / "Strike that." → delete the referenced section and drop the instruction.',
      '   - "Make this section sound more professional." / "Rewrite the intro as a bullet list." → rewrite the referenced span accordingly and drop the instruction.',
      '   - "Replace X with Y." / "Change every ‘foo’ to ‘bar’." → apply the replacement and drop the instruction.',
      '   Only treat something as a meta-command if it is clearly directed at the post-processor (cues like "actually,", "scratch that", "ignore", "delete", "remove", "replace", "change", "make this …", "rewrite …"). When in doubt, KEEP the text as content.',
      '',
      'Do not summarize, paraphrase, translate, or invent content beyond what is needed to execute a meta-command. Output ONLY the resulting plain-text transcript — no preamble, no quotes, no commentary.'
    ].join('\n');

    try {
      const t0 = performance.now();
      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + orKey,
          'Content-Type': 'application/json',
          'HTTP-Referer': location.origin,
          'X-Title': 'Audio Transcribe'
        },
        body: JSON.stringify({
          model: orModel,
          messages: [
            { role: 'system', content: system },
            { role: 'user',   content: target }
          ],
          temperature: 0.2
        })
      });
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(res.status + ': ' + errText.slice(0, 300));
      }
      const data = await res.json();
      const cleaned = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content || '').trim();
      if (!cleaned) throw new Error('empty response');

      if (cleanWhole) {
        transcript.value = cleaned;
      } else {
        const before = transcript.value.slice(0, rangeStart).replace(/\s+$/, '');
        const sep = before ? '\n\n' : '';
        transcript.value = before + sep + cleaned;
      }
      saveSnapshot(beforeSnapshot, transcript.value);
      persistTranscript();
      updateOutputButtons();
      if (diffMode === 2) renderSnapshotDiff();
      else if (diffMode === 1) renderRawTranscription();
      const secs = ((performance.now() - t0) / 1000).toFixed(1);
      notify('Cleaned in ' + secs + 's.', 'ok');
    } catch (err) {
      console.error(err);
      notify('Cleanup error: ' + err.message, 'err');
    } finally {
      setBusy(false);
    }
  }

  /* -------- Buttons -------- */
  cutBtn.addEventListener('click', async () => {
    const text = transcript.value;
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      transcript.select();
      try { document.execCommand('copy'); } catch {}
    }
    transcript.value = '';
    clearSnapshot();
    persistTranscript();
    updateOutputButtons();
    notify('Copied & cleared.', 'ok');
  });

  diffBtn.addEventListener('click', () => {
    if (!hasSnapshot()) return;
    setDiffMode((diffMode + 1) % 3);
  });

  /* -------- Persist transcript text -------- */
  let _persistTimer = null;
  function persistTranscript() {
    clearTimeout(_persistTimer);
    _persistTimer = setTimeout(() => {
      localStorage.setItem(KEY_TRANSCRIPT, transcript.value);
    }, 250);
  }

  transcript.addEventListener('input', () => {
    persistTranscript();
    updateOutputButtons();
  });

  /* -------- Settings load + migrate legacy split keys -------- */
  let storedKeys = localStorage.getItem(KEY_KEYS);
  if (storedKeys === null) {
    const legacyOr   = (localStorage.getItem(LEGACY_KEY_OR)   || '').trim();
    const legacyGroq = (localStorage.getItem(LEGACY_KEY_GROQ) || '').trim();
    if (legacyOr || legacyGroq) {
      storedKeys = legacyOr + '\n' + legacyGroq;
      localStorage.setItem(KEY_KEYS, storedKeys);
      localStorage.removeItem(LEGACY_KEY_OR);
      localStorage.removeItem(LEGACY_KEY_GROQ);
    } else {
      storedKeys = '';
    }
  }
  keysInput.value    = storedKeys;
  modelInput.value   = localStorage.getItem(KEY_MODEL)    || '';
  langInput.value    = localStorage.getItem(KEY_LANG)     || '';
  orModelInput.value = localStorage.getItem(KEY_OR_MODEL) || '';
  const { groq: loadedGroq } = parseKeys(storedKeys);
  if (!loadedGroq) settings.open = true;

  saveBtn.addEventListener('click', () => {
    const { openrouter, groq } = parseKeys(keysInput.value);
    const normalized = (openrouter || groq) ? (openrouter + '\n' + groq) : '';
    localStorage.setItem(KEY_KEYS,     normalized);
    localStorage.setItem(KEY_MODEL,    modelInput.value.trim());
    localStorage.setItem(KEY_LANG,     langInput.value.trim());
    localStorage.setItem(KEY_OR_MODEL, orModelInput.value.trim());
    keysInput.value = normalized;
    notify('Settings saved.', 'ok');
  });

  /* -------- Web Share Target intake -------- */
  async function loadSharedFile() {
    const params = new URLSearchParams(location.search);
    if (!params.has('shared')) return;
    history.replaceState({}, '', location.pathname);

    notify('Loading shared audio…', 'busy');
    try {
      if ('serviceWorker' in navigator) {
        await navigator.serviceWorker.ready;
      }
      const res = await caches.match('/__shared_audio__');
      if (!res) {
        notify('No shared file found.', 'err');
        return;
      }
      const blob = await res.blob();
      const name = decodeURIComponent(res.headers.get('x-filename') || 'shared-audio.m4a');
      const file = new File([blob], name, { type: blob.type || 'audio/mp4' });
      const cache = await caches.open('audio-transcribe-shared');
      await cache.delete('/__shared_audio__');
      handleFile(file);
    } catch (e) {
      console.error(e);
      notify('Could not read shared file: ' + e.message, 'err');
    }
  }

  /* -------- Init -------- */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  const cachedTranscript = localStorage.getItem(KEY_TRANSCRIPT);
  if (cachedTranscript) transcript.value = cachedTranscript;
  updateOutputButtons();
  const savedMode = parseInt(localStorage.getItem(KEY_DIFF_ON) || '0', 10);
  setDiffMode((savedMode >= 0 && savedMode <= 2) ? savedMode : 0);
  setRecState('idle');

  loadSharedFile();
</script>
</body>
</html>
